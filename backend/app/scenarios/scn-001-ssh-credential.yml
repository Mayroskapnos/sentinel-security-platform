id: SCN-001
name: SSH Credential Activity
description: Generates bounded failed SSH authentication attempts followed by one successful lab authentication.
risk: low
estimated_seconds: 28
targets: [employee-01, admin-server]
expected_detections: [DET-SSH-001, DET-SSH-002]
steps:
  - name: Controlled authentication failures
    action: controlled_failed_authentication
    target: employee-01
    count: 10
  - name: Allow authentication telemetry to settle
    action: wait
    seconds: 2
  - name: Controlled successful authentication
    action: controlled_successful_authentication
    target: employee-01
