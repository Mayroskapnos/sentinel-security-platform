pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    fastcgi_temp_path /tmp/fastcgi;
    proxy_temp_path /tmp/proxy;
    scgi_temp_path /tmp/scgi;
    uwsgi_temp_path /tmp/uwsgi;

    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://sentinel-web:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto http;
        }
    }

    # Internal management-to-lab bridge for the fixed simulator API only.
    # Port 8082 is never published by Compose.
    server {
        listen 8082;
        server_name _;

        location /internal/simulator/ {
            proxy_pass http://sentinel-simulator:8080;
            proxy_http_version 1.1;
            proxy_set_header Host sentinel-simulator;
            proxy_set_header X-Sentinel-Simulation-Key $http_x_sentinel_simulation_key;
        }

        location / {
            return 404;
        }
    }
}
